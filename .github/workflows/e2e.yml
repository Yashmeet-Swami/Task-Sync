name: E2E (Docker Compose + Playwright)

# Manually triggered rather than run on every push/PR: this suite drives the full
# Docker Compose stack and its register/login steps go through Arcjet's real
# fraud-detection service, which has observed variable latency (~5-30s+) depending
# on how the calling IP gets classified. That's fine for an on-demand deep-check, but
# not something that should be able to block or flake out every PR's required checks.
on:
  workflow_dispatch:

jobs:
  e2e:
    name: Full stack E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate backend/.env for Docker Compose
        run: |
          cat <<EOF > backend/.env
          NODE_ENV=development
          PORT=5000
          MONGODB_URI=mongodb://mongo:27017/tasksync
          JWT_SECRET=$(openssl rand -hex 32)
          ACCESS_TOKEN_SECRET=$(openssl rand -hex 32)
          REFRESH_TOKEN_SECRET=$(openssl rand -hex 32)
          ACCESS_TOKEN_EXPIRES_IN=15m
          REFRESH_TOKEN_EXPIRES_IN=7d
          FRONTEND_URL=http://localhost:5173
          EMAIL_USER=ci@example.com
          EMAIL_PASS=dummy-password-mailpit-ignores-auth
          SMTP_HOST=mailpit
          SMTP_PORT=1025
          SMTP_SECURE=false
          ARCJET_KEY=${{ secrets.ARCJET_KEY }}
          EOF

      - name: Start the full stack
        run: docker compose up --build -d

      - name: Wait for the backend to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5000/health > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"
          docker compose logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
